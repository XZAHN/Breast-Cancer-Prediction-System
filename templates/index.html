<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breast Cancer Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Breast Cancer Prediction System</h1>
        <p class="subtitle">Enter tumor features to predict diagnosis</p>
        
        <div class="card">
            <form action="/" method="POST">
                <div class="input-group">
                    <label for="radius_mean">Radius Mean</label>
                    <input type="number" step="any" id="radius_mean" name="radius_mean" required placeholder="e.g. 14.0">
                </div>
                
                <div class="input-group">
                    <label for="texture_mean">Texture Mean</label>
                    <input type="number" step="any" id="texture_mean" name="texture_mean" required placeholder="e.g. 20.5">
                </div>
                
                <div class="input-group">
                    <label for="perimeter_mean">Perimeter Mean</label>
                    <input type="number" step="any" id="perimeter_mean" name="perimeter_mean" required placeholder="e.g. 90.0">
                </div>
                
                <div class="input-group">
                    <label for="area_mean">Area Mean</label>
                    <input type="number" step="any" id="area_mean" name="area_mean" required placeholder="e.g. 600.0">
                </div>
                
                <div class="input-group">
                    <label for="smoothness_mean">Smoothness Mean</label>
                    <input type="number" step="any" id="smoothness_mean" name="smoothness_mean" required placeholder="e.g. 0.09">
                </div>

                <button type="submit" class="btn">Predict</button>
            </form>
        </div>

        {% if prediction %}
        <div class="result-card {{ prediction.lower() }}">
            <h2>Prediction Result</h2>
            <div class="prediction-value">{{ prediction }}</div>
            <p class="disclaimer">Note: This is for educational purposes only.</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
